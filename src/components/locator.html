<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Service Section</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #1F1F27;
        }

        /* Section Styles */
        .customer-service {
            width: 100%;
            background: transparent;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .service-row {
            display: flex;
            flex-wrap: wrap;
            margin: 0 -10px;
        }

        .service-col {
            flex: 0 0 33.333%;
            max-width: 33.333%;
            padding: 0 10px;
        }

        /* Column Styles */
        .service-card {
            background: rgba(0,0,0,0);
            padding: 62px 0 64px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            height: 100%;
        }

        .service-card:last-child {
            background: #ffffff;
        }

        .full-width {
            width: 100%;
        }

        /* Content Styles */
        .service-content {
            margin-bottom: 20px;
        }

        .service-content svg {
            margin-bottom: 5px;
        }

        .service-content h5 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #1F1F27;
        }

        .service-content p {
            font-size: 15px;
            color: #666;
            margin-bottom: 0;
        }

        .service-content a[href^="tel:"] {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
            display: block;
            color: #1F1F27;
            text-decoration: none;
        }

        /* Button Styles */
        .service-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 32px;
            font-size: 16px;
            font-weight: 400;
            text-decoration: none;
            border-radius: 40px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 48px;
            position: relative;
            overflow: hidden;
        }

        .btn-dark {
            background: #1f1f27;
            color: #ffffff;
            border-color: #1f1f27;
        }

        .btn-dark:hover {
            background: #149cfe;
            color: #ffffff;
            border-color: #149cfe;
        }

        /* Social Media Styles */
        .social-section {
            margin-top: 20px;
        }

        .social-list {
            display: flex;
            justify-content: center;
        }

        .social-icons {
            display: flex;
            gap: 20px;
        }

        .social-icons a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #222222;
            color: #878787;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-icons a:hover {
            background: #149cfe;
            color: white;
            transform: translateY(-2px);
        }

        .social-icons svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Border between columns on desktop */
        @media (min-width: 1150px) {
            .service-row .service-col:not(:last-child) {
                border-right: 1px solid #e5e5e5;
            }
        }

        /* Tablet Styles */
        @media (max-width: 1024px) {
            .service-col-md {
                flex: 0 0 33.333%;
                max-width: 33.333%;
            }
            
            .service-card {
                padding: 30px 0;
            }
            
            .service-btn {
                font-size: 15px;
                padding: 12px 32px;
                min-height: 48px;
            }
        }

        /* Mobile Styles */
        @media (max-width: 768px) {
            .service-col-mobile {
                flex: 0 0 100%;
                max-width: 100%;
            }
            
            .service-card {
                padding: 15px 0;
            }
            
            .service-btn {
                font-size: 14px;
                padding: 12px 30px;
                min-height: 45px;
            }
            
            .social-icons {
                gap: 16px;
            }
            
            .social-icons a {
                width: 32px;
                height: 32px;
            }
            
            /* Remove borders on mobile */
            .service-row .service-col:not(:last-child) {
                border-right: none;
                border-bottom: 1px solid #e5e5e5;
                margin-bottom: 20px;
                padding-bottom: 20px;
            }
        }

        /* Animation Styles */
        .animate-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }

        .animate-on-scroll.animate {
            opacity: 1;
            transform: translateY(0);
        }

        /* Button Hover Effect */
        .btn-sweep {
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn-sweep::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #149cfe;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: -1;
        }

        .btn-sweep:hover::before {
            transform: translateY(0);
        }
    </style>
</head>

    <script>
        // Animation on scroll
        document.addEventListener('DOMContentLoaded', function() {
            const animateElements = document.querySelectorAll('.animate-on-scroll');
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('animate');
                    }
                });
            }, { threshold: 0.1 });
            
            animateElements.forEach(element => {
                observer.observe(element);
            });
        });
    </script>
